[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc-trip-duration"
version = "0.1.0"
description = "Production-ready machine learning pipeline for NYC Taxi Trip Duration prediction"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Sohaib", email = "sohaib@example.com" }
]
keywords = ["machine-learning", "xgboost", "nyc-taxi", "regression", "mlops", "data-science"]
dependencies = [
    "numpy>=1.22.0",
    "pandas>=1.5.0",
    "scipy>=1.9.0",
    "scikit-learn>=1.2.0",
    "xgboost>=1.7.0",
    "holidays>=0.20",
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
    "joblib>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ipykernel>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
